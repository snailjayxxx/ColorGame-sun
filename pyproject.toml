[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colorgame-detector"
version = "0.1.0"
description = "Screen region RGB and brightness outlier detector for color-block games"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "snailjayxxx"}]
dependencies = [
  "mss>=9.0,<11",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "Pillow>=10.2,<13",
  "pynput>=1.7,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pyinstaller>=6.10,<7",
]

[project.scripts]
colorgame = "colorgame.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
