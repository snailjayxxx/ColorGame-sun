name: Windows EXE build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Build ColorGame.exe
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name ColorGame
          --collect-all pynput
          run.py

      - name: Create SHA-256 file
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/ColorGame.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ColorGame.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorGame-Windows
          path: |
            dist/ColorGame.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest $env:GITHUB_SHA
          git push origin refs/tags/latest --force

          $notes = @"
          ColorGame 自动构建版本。

          - Windows：下载 ``ColorGame.exe``
          - Apple Silicon Mac：下载 ``ColorGame-macOS-Apple-Silicon.dmg`` 或 ZIP
          "@
          $notes | Out-File -Encoding utf8 release-notes.md

          gh release view latest 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit latest --title "ColorGame 最新版" --notes-file release-notes.md --latest
          } else {
            gh release create latest --title "ColorGame 最新版" --notes-file release-notes.md --latest
          }
          gh release upload latest dist/ColorGame.exe dist/SHA256SUMS.txt --clobber
